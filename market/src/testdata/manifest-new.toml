id = "herdr-file-viewer"
name = "herdr-file-viewer"
version = "1.19.0"
platforms = ["linux", "macos", "windows"]

[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install.ps1"]

[[startup]]
command = ["powershell", "-File", "scripts/daemon.ps1"]
